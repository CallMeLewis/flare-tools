[package]
name = "flare-tools"
version = "0.4.0"
description = "Flare Tools: builds, signs and publishes DayZ mods"
authors = ["CallMeLewis"]
license = "GPL-3.0-or-later"
repository = "https://github.com/CallMeLewis/flare-tools"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flare_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
junction = "1"
winreg = "0.55"
steamworks = "0.13"
tauri-plugin-flare-updater = { path = "../../flare-common/crates/tauri-plugin-flare-updater" }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
